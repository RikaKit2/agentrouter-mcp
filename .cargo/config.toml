[env]
RUSTC_BOOTSTRAP = "1"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",
  "-Zshare-generics=y",
  "-Zcodegen-backend=cranelift",
]

[profile.dev]
lto = false
panic = "unwind"
strip = "none"
debug = "line-tables-only"
split-debuginfo = "unpacked"
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
# Cranelift does not support LTO; keep false
lto = false
panic = "abort"
strip = "symbols"
debug = false
opt-level = 3
