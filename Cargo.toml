[package]
name = "agentrouter-mcp"
version = "0.1.0"
edition = "2024"
description = "High-performance stdio MCP server for ChatGPT 6.1 Sol code reviews via AgentRouter"
authors = ["RikaKit2"]
license = "MIT OR Apache-2.0"

[dependencies]
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
schemars = "1.2.3"
