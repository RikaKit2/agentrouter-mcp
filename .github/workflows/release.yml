name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies & Mold linker (Linux)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang mold \
            libssl-dev libzstd-dev
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          mold --version

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift, rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --locked

  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies & Mold linker (Linux)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang mold \
            libssl-dev libzstd-dev
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          mold --version

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release assets
        run: |
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="agentrouter-mcp") | "v" + .version')
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="$PKG_VERSION"
          fi

          echo "Packaging version: ${VERSION}"

          sha256sum target/release/agentrouter-mcp > target/release/agentrouter-mcp.sha256

          ARCHIVE_NAME="agentrouter-mcp-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C target/release agentrouter-mcp
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentrouter-mcp-linux-x86_64
          path: |
            target/release/agentrouter-mcp
            target/release/agentrouter-mcp.sha256
            agentrouter-mcp-*-x86_64-unknown-linux-gnu.tar.gz
            agentrouter-mcp-*-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/agentrouter-mcp
            target/release/agentrouter-mcp.sha256
            agentrouter-mcp-*-x86_64-unknown-linux-gnu.tar.gz
            agentrouter-mcp-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
